openapi: 3.0.0
info:
  title: Usuarios API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /BuscarUsuarioPorId/{id}:
    get:
      summary: Buscar usuario por ID
      description: Busca un usuario por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a buscar
          schema:
            type: integer
      responses:
        "200":
          description: Usuario encontrado
        "400":
          description: ID no válido
        "404":
          description: Usuario no encontrado


  /InsertarUsuario:
    post:
      summary: Insertar usuario
      description: Inserta un nuevo usuario en la base de datos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                genero:
                  type: string
                  description: Género del usuario
                nombre:
                  type: string
                  description: Nombre del usuario
                apellido:
                  type: string
                  description: Apellido del usuario
                ciudad:
                  type: string
                  description: Ciudad del usuario
                pais:
                  type: string
                  description: País del usuario
                coordenadas:
                  type: object
                  properties:
                    latitud:
                      type: string
                    longitud:
                      type: string
                login:
                  type: object
                  properties:
                    username:
                      type: string
                    password:
                      type: string
                email:
                  type: string
                  format: email
                  description: Correo electrónico del usuario
                fechaNacimiento:
                  type: string
                  format: date
                  description: Fecha de nacimiento en formato YYYY-MM-DD
                celular:
                  type: string
                  description: Número de celular
      responses:
        "201":
          description: Usuario creado exitosamente
        "400":
          description: Datos inválidos
        "500":
          description: Error interno del servidor
  /ActualizarCorreo/{id}:
    patch:
      summary: Actualizar Correo
      description: Actualiza el correo de un usuario por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a actualizar
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  format: email
                  description: Nuevo correo electrónico del usuario
      responses:
        "200":
          description: Correo actualizado exitosamente
        "400":
          description: Datos inválidos
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor


  /users:
    get:
      summary: Obtener lista de usuarios
      description: Obtiene una lista de usuarios desde JSONPlaceholder
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
            
        "500":
          description: Error interno del servidor